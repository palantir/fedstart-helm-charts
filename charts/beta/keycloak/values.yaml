keycloak:
  auth:
    passwordSecretKey: password
    adminUser: admin

  networkPolicy:
    enabled: false

  postgresql:
    enabled: false

  externalDatabase:
    host: "__REPLACE_ME_DATABASE_HOST_DOMAIN"
    port: 5432
    database: keycloak
    existingSecret: secret
    existingSecretPasswordKey: password
    existingSecretUserKey: user

  global:
    compatibility:
      omitEmptySeLinuxOptions: true

  service:
    headless:
      annotations:
        com.palantir.rubix.service/pod-cert: '{}'
    annotations:
      com.palantir.rubix.service/pod-cert: '{}'
      com.palantir.rubix.service.spp/v3: '{"endpoints":[{"name":"https","prefix":"/keycloak","domain-aliases":["DEFAULT"]}]}'

  httpRelativePath: "/keycloak/"

  production: true

  tls:
    enabled: true
    autoGenerated:
      enabled: false
    usePemCerts: true
    existingSecret: "cert-{{ .Release.Name }}"

  extraEnvVars:
    - name: KC_HTTPS_CERTIFICATES_RELOAD_PERIOD
      value: '-1'

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: keycloak
            topologyKey: topology.kubernetes.io/zone
          weight: 100
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
          topologyKey: kubernetes.io/hostname
